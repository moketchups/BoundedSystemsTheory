name: Deploy Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        working-directory: web
        run: |
          npm ci
          node scripts/build-data.js
          cd .. && python3 scripts/convergence_analysis.py --mode heuristic --output web/public/data/analysis.json && cd web
          npx vite build --base=/BoundedSystemsTheory/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
